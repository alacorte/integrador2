spring:
  activemq:
    broker-url: vm://parametrizador-teste?broker.persistent=false&broker.useJmx=false

  datasource:
    url: jdbc:h2:mem:parametrizador;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # As migrations sao MySQL puro; no teste quem cria o schema e o Hibernate.
  flyway:
    enabled: false
