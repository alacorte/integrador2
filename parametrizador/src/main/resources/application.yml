spring:
  application:
    name: parametrizador

  activemq:
    broker-url: tcp://localhost:61616

  datasource:
    url: jdbc:mysql://localhost:3306/parametrizador_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: integrador2
    password: integrador2

  jpa:
    # O schema e do Flyway; o Hibernate so mapeia.
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-sem-correlacao}] %logger{36} - %msg%n"
